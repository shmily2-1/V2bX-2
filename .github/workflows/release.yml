name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2
  CGO_ENABLED: '0'
  BUILD_TAGS: sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -tags "$BUILD_TAGS" -count=1 -timeout 180s ./...
      - name: Check compatibility patch reproducibility
        run: python3 scripts/check-sing-patches.py

  porthop-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [nftables, iptables]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install isolated test prerequisites
        run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2
      - name: Real UDP forwarding and QUIC port hopping (disposable network namespace)
        run: bash scripts/test-porthop-netns.sh "${{ matrix.backend }}"

  build:
    needs: [test, porthop-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, name: linux-amd64}
          - {goos: linux, goarch: arm64, name: linux-arm64}
          - {goos: windows, goarch: amd64, name: windows-amd64}
          - {goos: darwin, goarch: arm64, name: darwin-arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          mkdir -p dist
          binary=V2bX
          if [ "$GOOS" = windows ]; then binary=V2bX.exe; fi
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -X github.com/shmily2-1/V2bX-2/cmd.version=$VERSION" -o "dist/$binary" .
          cp README.md LICENSE dist/
          cp -r docs dist/
          cp -r example dist/
          cd dist
          zip -q -r "../V2bX-${{ matrix.name }}.zip" .
          cd ..
          sha256sum "V2bX-${{ matrix.name }}.zip" > "V2bX-${{ matrix.name }}.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: V2bX-${{ matrix.name }}
          path: |
            V2bX-*.zip
            V2bX-*.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V2bX-*
          merge-multiple: true
          path: artifacts
      - name: Publish prerelease for explicit acceptance testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" artifacts/* --title "$VERSION" --generate-notes --prerelease
