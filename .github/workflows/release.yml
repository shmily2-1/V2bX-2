name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2
  CGO_ENABLED: '0'
  BUILD_TAGS: sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install installer test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck unzip
      - name: Validate installer and offline safety regressions
        run: |
          bash -n scripts/install.sh
          bash -n install.sh V2bX.sh initconfig.sh
          shellcheck scripts/install.sh
          shellcheck install.sh V2bX.sh initconfig.sh
          python3 -m py_compile configure.py provision.py system-tools.py
          python3 scripts/test-install.py
          python3 scripts/test-bootstrap.py
          python3 scripts/test-provision.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -tags "$BUILD_TAGS" -count=1 -timeout 180s ./...
      - name: Check compatibility patch reproducibility
        run: python3 scripts/check-sing-patches.py

  porthop-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [nftables, iptables]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install isolated test prerequisites
        run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2
      - name: Real UDP forwarding and QUIC port hopping (disposable network namespace)
        run: bash scripts/test-porthop-netns.sh "${{ matrix.backend }}"
      - name: Real maintenance firewall apply and rollback (disposable network namespace)
        run: sudo env V2BX_SYSTEM_TOOLS_NETNS=1 unshare --net python3 scripts/test-system-tools-netns.py

  porthop-debian12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build test binaries for old nftables acceptance
        run: |
          mkdir -p netns-tests
          go test -c -tags "$BUILD_TAGS" -o netns-tests/core.test ./core
          go test -c -o netns-tests/firewall.test ./common/porthop
      - name: Debian 12 nft 1.0.6 real NAT and QUIC hopping
        run: |
          docker run --rm --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            -v "$PWD:/src:ro" -w /src debian:12 bash -eu -c '
              apt-get update -qq && apt-get install -y -qq nftables iproute2 util-linux python3
              nft --version
              unshare --net bash -eu -c "
                ip link set lo up
                export V2BX_TEST_NETNS=1 V2BX_FIREWALL_BACKEND=nftables
                ./netns-tests/firewall.test -test.run TestRedirectNetNS -test.v -test.timeout=90s
                ./netns-tests/core.test -test.run TestPortHoppingNetNS -test.v -test.timeout=120s
              "
              env V2BX_SYSTEM_TOOLS_NETNS=1 unshare --net python3 scripts/test-system-tools-netns.py
            '

  build:
    needs: [test, porthop-linux, porthop-debian12, installer]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, name: linux-amd64}
          - {goos: linux, goarch: arm64, name: linux-arm64}
          - {goos: windows, goarch: amd64, name: windows-amd64}
          - {goos: darwin, goarch: arm64, name: darwin-arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          mkdir -p dist
          binary=V2bX
          if [ "$GOOS" = windows ]; then binary=V2bX.exe; fi
          go build -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-s -w -X github.com/shmily2-1/V2bX-2/cmd.version=$VERSION" -o "dist/$binary" .
          cp README.md LICENSE dist/
          cp -r docs dist/
          cp -r example dist/
          mkdir -p dist/management
          cp install.sh V2bX.sh initconfig.sh configure.py provision.py system-tools.py dist/
          cp V2bX.sh initconfig.sh configure.py provision.py system-tools.py dist/management/
          cp scripts/install.sh dist/management/install.sh
          cp install.sh dist/management/bootstrap.sh
          mkdir -p dist/licenses
          cp third_party/sing-box/LICENSE dist/licenses/sing-box-LICENSE
          printf 'Repository: https://github.com/%s\nCommit: %s\nSource: https://github.com/%s/archive/%s.tar.gz\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/SOURCE.txt
          cd dist
          zip -q -r "../V2bX-${{ matrix.name }}.zip" .
          cd ..
          sha256sum "V2bX-${{ matrix.name }}.zip" > "V2bX-${{ matrix.name }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ matrix.name }}
          path: |
            V2bX-*.zip
            V2bX-*.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: V2bX-*
          merge-multiple: true
          path: artifacts
      - name: Publish prerelease for explicit acceptance testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp install.sh V2bX.sh initconfig.sh configure.py provision.py system-tools.py artifacts/
          (cd artifacts && sha256sum install.sh > install.sh.sha256 && sha256sum V2bX.sh > V2bX.sh.sha256 && sha256sum initconfig.sh > initconfig.sh.sha256 && sha256sum configure.py > configure.py.sha256 && sha256sum provision.py > provision.py.sha256 && sha256sum system-tools.py > system-tools.py.sha256)
          gh release create "$VERSION" artifacts/* --verify-tag --title "$VERSION" \
            --notes-file docs/RELEASE-NOTES.md --prerelease
